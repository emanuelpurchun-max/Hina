<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Hina AI</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Asistente virtual anime con avatar 3D y chat impulsado por Gemini." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hina AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #info {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #ffffff;
        font-size: 13px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 6px;
        pointer-events: none;
        z-index: 10;
      }

      #chat-container {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: min(720px, calc(100% - 32px));
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
      }

      #chat-log {
        max-height: 40vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px;
        border-radius: 18px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: none;
        pointer-events: auto;
      }

      #chat-log:empty {
        display: none;
      }

      #chat-log::-webkit-scrollbar {
        width: 6px;
      }
      #chat-log::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 3px;
      }

      .chat-message {
        max-width: 80%;
        padding: 8px 14px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .chat-message.user {
        align-self: flex-end;
      }
      .chat-message.bot {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chat-message.system {
        align-self: center;
        font-size: 12px;
        opacity: 0.75;
        font-style: italic;
        background: rgba(255, 255, 255, 0.03);
      }
      .chat-message.bot .bubble-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .chat-attachment {
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.85;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .chat-attachment .att-thumb {
        max-width: 200px;
        max-height: 140px;
        border-radius: 8px;
        margin-top: 4px;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .play-btn {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        line-height: 1;
        transition: background 0.15s ease, transform 0.1s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .play-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .play-btn:active {
        transform: scale(0.92);
      }
      .play-btn svg {
        width: 10px;
        height: 10px;
        fill: #fff;
        display: block;
        margin-left: 1px;
      }

      #attachment-preview {
        display: none;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        pointer-events: auto;
      }
      #attachment-preview.visible {
        display: flex;
      }
      .attachment-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px 4px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 12px;
        max-width: 220px;
      }
      .attachment-chip .att-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .attachment-chip button {
        background: transparent;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 0 4px;
        font-size: 14px;
        line-height: 1;
        opacity: 0.7;
      }
      .attachment-chip button:hover {
        opacity: 1;
      }

      #chat-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(5px) saturate(140%);
        -webkit-backdrop-filter: blur(5px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        pointer-events: auto;
      }

      .chat-btn {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.18s ease, transform 0.18s ease;
      }
      .chat-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      .chat-btn:active {
        transform: scale(0.94);
      }
      .chat-btn.recording {
        background: rgba(255, 70, 70, 0.6);
        border-color: rgba(255, 200, 200, 0.5);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 70, 70, 0.5); }
        50%      { box-shadow: 0 0 0 8px rgba(255, 70, 70, 0); }
      }
      .chat-btn svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #chat-input {
        flex: 1 1 auto;
        background: transparent;
        border: none;
        outline: none;
        color: #ffffff;
        font-size: 15px;
        padding: 10px 8px;
        min-width: 0;
      }
      #chat-input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      #send-btn {
        background: linear-gradient(135deg, #6a8bff, #b06bff);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 18px;
        font-weight: 600;
      }
      #send-btn:hover {
        background: linear-gradient(135deg, #7c9cff, #c07cff);
      }

      @media (max-width: 480px) {
        .chat-btn {
          width: 36px;
          height: 36px;
        }
        #chat-input {
          font-size: 14px;
        }
      }

      #lock-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 25, 0.85);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      #lock-overlay.hidden {
        display: none;
      }
      .lock-card {
        width: min(380px, calc(100% - 40px));
        padding: 28px 26px 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .lock-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .lock-hint {
        margin-top: 6px;
        margin-bottom: 18px;
        font-size: 13px;
        opacity: 0.75;
      }
      .lock-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .lock-input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        font-size: 15px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.25);
        color: #fff;
        outline: none;
      }
      .lock-input:focus {
        border-color: rgba(176, 107, 255, 0.7);
        box-shadow: 0 0 0 2px rgba(176, 107, 255, 0.25);
      }
      .lock-btn {
        padding: 12px 18px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: linear-gradient(135deg, #6a8bff, #b06bff);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .lock-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .lock-error {
        min-height: 16px;
        font-size: 12px;
        color: #ffb4b4;
      }

      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 15, 30, 0.55);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        cursor: pointer;
        transition: opacity 0.4s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #start-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .start-overlay-card {
        text-align: center;
        padding: 28px 40px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      }
      .start-overlay-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .start-overlay-hint {
        margin-top: 6px;
        font-size: 13px;
        opacity: 0.7;
      }

      /* FASE 6 · reproductor de música (lofi) */
      #music-overlay {
        position: fixed;
        right: 16px;
        bottom: 110px;
        width: min(360px, 92vw);
        z-index: 90;
        background: rgba(15, 15, 30, 0.92);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
        padding: 10px 12px 12px;
        color: #fff;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #music-overlay.visible {
        display: flex;
      }
      .music-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .music-title {
        font-size: 13px;
        font-weight: 600;
        opacity: 0.9;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .music-close {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      #music-iframe {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        border-radius: 10px;
        background: #000;
      }
      .music-hint {
        font-size: 11px;
        opacity: 0.6;
        text-align: center;
      }

      /* FASE 7 · barra de carga global (outfits + animaciones) */
      #load-bar {
        position: fixed;
        left: 50%;
        top: 14px;
        transform: translateX(-50%);
        z-index: 80;
        width: min(380px, calc(100% - 32px));
        padding: 8px 12px 10px;
        border-radius: 12px;
        background: rgba(15, 15, 30, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        color: #fff;
        font-size: 12px;
        display: none;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      #load-bar.visible {
        display: flex;
      }
      #load-bar-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        opacity: 0.9;
      }
      #load-bar-label .pct {
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }
      #load-bar-track {
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #load-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6a8bff, #b06bff);
        transition: width 0.18s ease;
      }

      /* FASE 7 · selector rápido de armario */
      #wardrobe-overlay {
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 70;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 180px;
      }
      .wardrobe-btn {
        background: rgba(15, 15, 30, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        text-align: left;
        transition: background 0.15s ease;
      }
      .wardrobe-btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .wardrobe-btn.current {
        border-color: rgba(176, 107, 255, 0.65);
        background: rgba(176, 107, 255, 0.18);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.1/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="lock-overlay" role="dialog" aria-modal="true" aria-labelledby="lock-title">
      <div class="lock-card">
        <div class="lock-title" id="lock-title">Hina AI · Acceso Privado</div>
        <div class="lock-hint">Escribe la frase clave para activar el chat y el modelo.</div>
        <form class="lock-form" id="lock-form" autocomplete="off">
          <input
            id="lock-input"
            class="lock-input"
            type="password"
            placeholder="Frase clave"
            aria-label="Frase clave"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" class="lock-btn" id="lock-btn">Entrar</button>
          <div class="lock-error" id="lock-error" role="alert"></div>
        </form>
      </div>
    </div>

    <div id="start-overlay" role="button" tabindex="0" aria-label="Toca para iniciar a Hina">
      <div class="start-overlay-card">
        <div class="start-overlay-title">Toca para iniciar a Hina</div>
        <div class="start-overlay-hint">Activa el audio de la conversación</div>
      </div>
    </div>

    <div id="info">Esperando acceso…</div>

    <div id="load-bar" role="status" aria-live="polite">
      <div id="load-bar-label">
        <span id="load-bar-text">Cargando…</span>
        <span class="pct" id="load-bar-pct">0%</span>
      </div>
      <div id="load-bar-track"><div id="load-bar-fill"></div></div>
    </div>

    <div id="wardrobe-overlay" aria-label="Armario rápido"></div>

    <div id="chat-container">
      <div id="chat-log"></div>

      <div id="attachment-preview" aria-live="polite"></div>

      <form id="chat-bar" autocomplete="off">
        <button type="button" class="chat-btn" id="camera-btn" aria-label="Tomar foto con la cámara" title="Cámara">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>

        <button type="button" class="chat-btn" id="file-btn" aria-label="Adjuntar archivo" title="Adjuntar PDF, Word, Excel, PPT, audio…">
          <svg viewBox="0 0 24 24">
            <path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.19 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49" />
          </svg>
        </button>

        <button type="button" class="chat-btn" id="mic-btn" aria-label="Grabar audio" title="Grabar audio">
          <svg viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <path d="M12 18v3" />
            <path d="M9 21h6" />
          </svg>
        </button>

        <input
          id="chat-input"
          type="text"
          placeholder="Escribe un mensaje…"
          aria-label="Mensaje"
        />

        <button type="submit" class="chat-btn" id="send-btn" aria-label="Enviar">
          ➤
        </button>
      </form>
    </div>

    <div id="music-overlay" role="region" aria-label="Reproductor de música">
      <div class="music-head">
        <div class="music-title" id="music-title">Lofi · Study music</div>
        <button type="button" class="music-close" id="music-close" aria-label="Cerrar reproductor">×</button>
      </div>
      <iframe
        id="music-iframe"
        title="Reproductor de música"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
      <div class="music-hint">Comando: /musica · /musica off</div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" hidden />
    <input
      type="file"
      id="file-input"
      hidden
      multiple
      accept="image/*,application/pdf,audio/*,text/plain,text/csv,application/json,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.md,.txt"
    />

    <script type="module" src="/script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((reg) =>
              console.log("[pwa] Service Worker registrado:", reg.scope),
            )
            .catch((err) =>
              console.warn("[pwa] Fallo registrando Service Worker:", err),
            );
        });
      }
    </script>
  </body>
</html>
