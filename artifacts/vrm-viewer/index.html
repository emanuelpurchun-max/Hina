<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Hina AI</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Asistente virtual anime con avatar 3D y chat impulsado por Gemini." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hina AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #info {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #ffffff;
        font-size: 13px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 6px;
        pointer-events: none;
        z-index: 10;
      }

      #chat-container {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: min(720px, calc(100% - 32px));
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
      }

      #chat-log {
        max-height: 40vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px;
        border-radius: 18px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: none;
        pointer-events: auto;
      }

      #chat-log:empty {
        display: none;
      }

      #chat-log::-webkit-scrollbar {
        width: 6px;
      }
      #chat-log::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 3px;
      }

      .chat-message {
        max-width: 80%;
        padding: 8px 14px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .chat-message.user {
        align-self: flex-end;
      }
      .chat-message.bot {
        align-self: flex-start;
      }

      #chat-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(5px) saturate(140%);
        -webkit-backdrop-filter: blur(5px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        pointer-events: auto;
      }

      .chat-btn {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.18s ease, transform 0.18s ease;
      }
      .chat-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      .chat-btn:active {
        transform: scale(0.94);
      }
      .chat-btn svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #chat-input {
        flex: 1 1 auto;
        background: transparent;
        border: none;
        outline: none;
        color: #ffffff;
        font-size: 15px;
        padding: 10px 8px;
        min-width: 0;
      }
      #chat-input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      #send-btn {
        background: linear-gradient(135deg, #6a8bff, #b06bff);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 18px;
        font-weight: 600;
      }
      #send-btn:hover {
        background: linear-gradient(135deg, #7c9cff, #c07cff);
      }

      @media (max-width: 480px) {
        .chat-btn {
          width: 36px;
          height: 36px;
        }
        #chat-input {
          font-size: 14px;
        }
      }

      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 15, 30, 0.55);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        cursor: pointer;
        transition: opacity 0.4s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #start-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .start-overlay-card {
        text-align: center;
        padding: 28px 40px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      }
      .start-overlay-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .start-overlay-hint {
        margin-top: 6px;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.1/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="start-overlay" role="button" tabindex="0" aria-label="Toca para iniciar a Hina">
      <div class="start-overlay-card">
        <div class="start-overlay-title">Toca para iniciar a Hina</div>
        <div class="start-overlay-hint">Activa el audio de la conversación</div>
      </div>
    </div>

    <div id="info">Cargando personaje.vrm…</div>

    <div id="chat-container">
      <div id="chat-log"></div>

      <form id="chat-bar" autocomplete="off">
        <button type="button" class="chat-btn" id="camera-btn" aria-label="Adjuntar imagen">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>

        <button type="button" class="chat-btn" id="mic-btn" aria-label="Grabar audio">
          <svg viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <path d="M12 18v3" />
            <path d="M9 21h6" />
          </svg>
        </button>

        <input
          id="chat-input"
          type="text"
          placeholder="Escribe un mensaje…"
          aria-label="Mensaje"
        />

        <button type="submit" class="chat-btn" id="send-btn" aria-label="Enviar">
          ➤
        </button>
      </form>
    </div>

    <script type="module" src="/script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((reg) =>
              console.log("[pwa] Service Worker registrado:", reg.scope),
            )
            .catch((err) =>
              console.warn("[pwa] Fallo registrando Service Worker:", err),
            );
        });
      }
    </script>
  </body>
</html>
