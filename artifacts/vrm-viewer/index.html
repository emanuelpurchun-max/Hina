<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Visor VRM</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 6px;
        pointer-events: none;
        z-index: 10;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.1/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">Cargando personaje.vrm…</div>
    <script type="module" src="/script.js"></script>
  </body>
</html>
